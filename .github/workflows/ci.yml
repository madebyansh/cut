name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install supported FFmpeg
        run: |
          brew install ffmpeg@7
          echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run cli:build
      - run: npm run verify
      - run: npm pack --dry-run
